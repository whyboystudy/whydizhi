<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>私人书签</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f8fa; color: #1f2328; line-height: 1.6;
  }
  #gate-card {
    max-width: 360px; margin: 18vh auto 0; background: #fff;
    border: 1px solid #d0d7de; border-radius: 8px; padding: 28px;
    text-align: center; box-shadow: 0 1px 3px rgba(31,35,40,.08);
  }
  #gate-card h1 { font-size: 18px; margin: 0 0 6px; }
  #gate-card p { color: #656d76; font-size: 13px; margin: 0 0 18px; }
  #gate-card input {
    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 12px;
  }
  #gate-card input:focus { outline: none; border-color: #0969da; }
  #gate-card button {
    width: 100%; padding: 8px 0; font-size: 14px; cursor: pointer;
    color: #fff; background: #1f883d; border: none; border-radius: 6px;
  }
  #gate-card button:hover { background: #1a7f37; }
  #gate-card label { font-size: 12px; color: #656d76; display: block; margin-bottom: 12px; }
  #err { color: #cf222e; font-size: 13px; min-height: 18px; margin: 0; }
  #content { max-width: 860px; margin: 0 auto; background: #fff;
    border: 1px solid #d0d7de; border-radius: 8px; padding: 32px 40px; }
  #content h1 { font-size: 28px; border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
  #content h2 { font-size: 22px; border-bottom: 1px solid #d0d7de; padding-bottom: 6px; margin-top: 32px; }
  #content h3 { font-size: 17px; margin-top: 24px; }
  #content a { color: #0969da; text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  #content th, #content td { border: 1px solid #d0d7de; padding: 6px 12px; text-align: left; }
  #content th { background: #f6f8fa; }
  #content tr:nth-child(even) td { background: #fbfcfd; }
  #content blockquote { color: #656d76; border-left: 3px solid #d0d7de; margin: 0; padding: 0 12px; }
</style>
</head>
<body>

<div id="gate">
  <div id="gate-card">
    <h1>&#128274; 私人书签</h1>
    <p>内容已加密，请输入访问密码</p>
    <form id="gate-form">
      <input type="password" id="pwd" placeholder="访问密码" autofocus autocomplete="current-password">
      <label><input type="checkbox" id="remember" checked> 本次会话记住密码</label>
      <button type="submit">解锁</button>
    </form>
    <p id="err"></p>
  </div>
</div>

<main id="content" hidden></main>

function b64ToBytes(b64) {
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function decryptContent(pwd) {
  var enc = new TextEncoder();
  var baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(DATA.salt),
      iterations: DATA.iter, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(DATA.iv) }, key, b64ToBytes(DATA.ct));
  return new TextDecoder().decode(pt);
}

function show(html) {
  document.getElementById("gate").hidden = true;
  var c = document.getElementById("content");
  c.innerHTML = html;
  c.hidden = false;
  document.title = c.querySelector("h1")
    ? c.querySelector("h1").textContent : "私人书签";
}

document.getElementById("gate-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  var pwd = document.getElementById("pwd").value;
  var err = document.getElementById("err");
  if (!pwd) { err.textContent = "请输入密码"; return; }
  err.textContent = "";
  try {
    var html = await decryptContent(pwd);
    if (document.getElementById("remember").checked)
      sessionStorage.setItem("wdz_pwd", pwd);
    show(html);
  } catch (ex) {
    err.textContent = "密码错误，解密失败";
  }
});

(async function autoUnlock() {
  var saved = sessionStorage.getItem("wdz_pwd");
  if (!saved) return;
  try { show(await decryptContent(saved)); }
  catch (ex) { sessionStorage.removeItem("wdz_pwd"); }
})();
</script>
